<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>頁面運作正常</title>
<style>
  :root {
    --bg: #fafafa;
    --ink: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --accent: #2f6fed;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2eb872;
    flex-shrink: 0;
  }

  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 12px;
  }

  p.lead {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .meta {
    border-top: 1px solid var(--line);
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .meta span.label {
    color: var(--ink);
    font-weight: 500;
  }

  code {
    background: #f0f0f0;
    border-radius: 4px;
    padding: 2px 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  a.accent {
    color: var(--accent);
    text-decoration: none;
  }

  a.accent:hover {
    text-decoration: underline;
  }

  @media (prefers-reduced-motion: no-preference) {
    .dot {
      animation: pulse 2s ease-in-out infinite;
    }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="status">
      <span class="dot"></span>
      部署成功
    </div>

    <h1>這個頁面正常運作。</h1>
    <p class="lead">如果你看到這段文字,代表 GitHub Pages 已經成功讀取並顯示這個 <code>index.html</code> 檔案。</p>

    <div class="meta">
      <div><span class="label">檔案路徑</span> · index.html</div>
      <div><span class="label">頁面載入時間</span> · <span id="time"></span></div>
      <div><span class="label">瀏覽器</span> · <span id="ua"></span></div>
    </div>
  </div>

  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('zh-TW', { hour12: false });
    document.getElementById('ua').textContent = navigator.userAgent.split(') ')[0].split(' (')[1] || navigator.platform;
  </script>

</body>
</html>
